# Vendor facets — Bettermode. The broadest of the hosted community builders on the Kin Score:
# besides the support channel it can carry a roadmap, a changelog and an articles space, all on
# the provider's own domain. Every one is a pointer the provider must declare and keep feeding.
vendor: bettermode
name: Bettermode
website: https://bettermode.com
areas:
- community
registry_keys: []
rubric_schema_version: 0.22.0
generated: '2026-09-25'
features_refreshed: '2026-09-25'
basis: capability
summary: >-
  Bettermode can carry four small pointer checks: support_channel (2 points), roadmap_present (2), change_log_present
  (6) and blog_present (1), because it ships roadmap, changelog and article spaces next to the forum,
  on a custom domain from the $149/month Starter plan. None arrives by itself. The provider must run each
  space and declare it, and a forum declared as Community earns half of support_channel because the pointer
  probe does not read that type. There is no registry key, so Bettermode customers cannot be detected
  or measured.
features:
- id: community-spaces
  name: Discussion, Q&A and help-center spaces
  description: Threaded discussion, question-and-answer and help-center spaces in one branded community.
  source: https://bettermode.com/product/feature-index-bettermode
  tier: all
- id: custom-domain
  name: Custom domain
  description: Moves the community onto the provider's own domain or subdomain; listed in the Starter
    plan.
  source: https://bettermode.com/pricing
  tier: paid
- id: roadmap-space
  name: Roadmap visualization with idea voting
  description: >-
    An interactive roadmap of planned work, fed by submitted and upvoted feature requests (the Podders
    template).
  source: https://bettermode.com/templates/podders-template-customer-feedback-community
  tier: unknown
- id: changelog-space
  name: Changelog and product-update spaces
  description: A space type that keeps "a record of every notable change", alongside product-update announcements.
  source: https://bettermode.com/product/feature-index-bettermode
  tier: unknown
- id: articles-space
  name: Articles space
  description: A space type for long-format posts and blogs.
  source: https://bettermode.com/product/feature-index-bettermode
  tier: unknown
maps:
- feature: community-spaces
  check: support_channel
  layer: composite
  credit: 0.5
  provider_must: >-
    Declare the community URL in apis.yml common[]. As Community it grades "unverified" (0.5) because
    probe-pointers.py does not probe Community; a help-center space declared as HelpCenter or Support
    is probed and earns 1.0 when live.
  catalog_pass_rate: 0.45
  facet: developer_ergonomics
  points: 2
  baseline_pass_rate: 0.69
- feature: roadmap-space
  check: roadmap_present
  layer: composite
  provider_must: Keep the roadmap space current and public, and declare its URL as RoadMap.
  catalog_pass_rate: 0.011
  facet: operational_transparency
  points: 2
  baseline_pass_rate: 0.037
- feature: changelog-space
  check: change_log_present
  layer: composite
  provider_must: Post dated entries for API changes in the changelog space and declare its URL as ChangeLog.
  catalog_pass_rate: 0.157
  facet: operational_transparency
  points: 6
  baseline_pass_rate: 0.438
- feature: articles-space
  check: blog_present
  layer: composite
  provider_must: Publish articles there and declare the space URL as Blog.
  catalog_pass_rate: 0.529
  facet: developer_ergonomics
  points: 1
  baseline_pass_rate: 0.731
out_of_reach:
  checks:
  - contract_present
  - status_page_present
  - sdk_count_1
  - documentation_present
  note: >-
    The community's own API and webhooks are Bettermode's; it cannot produce the provider's contract,
    status page or SDKs.
surface:
