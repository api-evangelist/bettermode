apis:
- name: Bettermode GraphQL API
  description: >-
    Bettermode's public GraphQL API for reading and writing community data —
    spaces, posts, members, reactions, tags, and collections — plus app
    installation and signed webhooks. Single POST endpoint per region (US / EU),
    bearer App/Member access tokens, Relay-style cursor pagination, and
    per-plan request + query-complexity rate limits.
