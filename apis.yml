aid: bettermode
name: Bettermode
description: >-
  Bettermode is an all-in-one customer community platform (formerly Tribe) that
  lets organizations launch branded, no-code communities to turn engagement into
  measurable retention and growth. It combines discussion forums, Q&A,
  knowledge base, member directories, events, wishlists, changelogs, and roadmaps
  with analytics and out-of-the-box integrations (Salesforce, HubSpot, Intercom,
  Segment). For developers, Bettermode exposes a GraphQL API (US and EU regions),
  an Apps framework with signed webhooks, embedding and custom-script surfaces,
  first-party @tribeplatform SDKs/UI kits, and a CLI. More than 50,000
  organizations use Bettermode. Backed by Bessemer Venture Partners and CRV.
